# WHY YAML over .properties?
# YAML supports nesting (spring.datasource.url becomes a tree), is more readable,
# and is the industry preference for Spring Boot. .properties is flat key-value — works
# fine but gets unwieldy with deep nesting.

spring:
  application:
    name: splitwise-backend

  # We use Spring Profiles to switch configs between dev and prod.
  # "dev" profile uses H2 in-memory DB so you don't need PostgreSQL installed.
  # "prod" profile would use real PostgreSQL.
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  # JPA / Hibernate configuration
  jpa:
    # ddl-auto options:
    # - create: Drops and recreates tables every restart (data lost)
    # - update: Alters tables to match entities (safe for dev, risky for prod)
    # - validate: Only checks if schema matches entities (safe for prod)
    # - none: Does nothing (you manage schema yourself with Flyway/Liquibase)
    # We use "update" for dev convenience. In production, use Flyway migrations.
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect

  # H2 file-based database — data persists across backend restarts
  # The DB file will be created at ./splitwise-db.mv.db in the backend folder
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:file:./splitwise-db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=TRUE;AUTO_RECONNECT=TRUE}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}

  # H2 console — web UI to inspect your database at http://localhost:8080/h2-console
  h2:
    console:
      enabled: true
      path: /h2-console

  # Mail configuration (using a dummy for dev, configure real SMTP for prod)
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:_INSERT_MAIL_USERNAME}
    password: ${MAIL_PASSWORD:_INSERT_MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

# JWT Configuration
# These values would come from environment variables in production (never hardcode secrets)
app:
  jwt:
    secret: ${JWT_SECRET:_REPLACE_JWT_SECRET_USE_OPENSSL_rand_base64_48_OR_RANDOM_256BIT_MIN_CHARS_OK________}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}
  ai:
    # gemini | openai | groq — Gemini uses generateContent; openai/groq use Bearer + POST {base-url}/chat/completions.
    # Groq: AI_PROVIDER=groq, AI_BASE_URL=https://api.groq.com/openai/v1, AI_MODEL=llama-3.3-70b-versatile (check Groq docs for current IDs).
    provider: ${AI_PROVIDER:gemini}
    enabled: ${AI_ENABLED:true}
    # Set AI_API_KEY in the environment — do not commit real keys here.
    api-key: ${AI_API_KEY:}
    model: ${AI_MODEL:gemini-2.0-flash}
    base-url: ${AI_BASE_URL:https://api.openai.com/v1}
    gemini-base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}
    timeout-seconds: ${AI_TIMEOUT:30}
    max-tokens: ${AI_MAX_TOKENS:1024}
    # DEV ONLY — trust any TLS certificate for Groq/OpenAI-compat/Gemini calls. Use when PKIX fails behind
    # corporate SSL inspection (Zscaler, etc.). Correct fix: import org root CA into java cacerts, then leave false.
    ssl-insecure: ${AI_SSL_INSECURE:false}

# Server configuration
server:
  port: ${SERVER_PORT:8080}

# Swagger/OpenAPI docs available at: http://localhost:8080/swagger-ui.html
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /api-docs

# Logging — show SQL parameters in dev for debugging
logging:
  level:
    com.splitwise: DEBUG
    org.springframework.security: DEBUG
